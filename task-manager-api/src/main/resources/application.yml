spring:
  application:
    name: task-manager-api
server:
  port: 9191

#Database configuration
datasource:
    url: jdbc:postgresql://localhost:5432/task_manager_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: root_password
    driver-class-name: org.postgresql.Driver

  # JPA configuration
jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging configuration
logging:
  level:
    root: INFO

#Keys for JWT	
jwt.private.key: classpath:app.key
jwt.public.key: classpath:app.pub

# Doc Api configuration
springdoc.api-docs:
  path: /v3/api-docs

